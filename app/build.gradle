plugins {
    id 'com.android.application'
}

android {
    namespace 'za.co.richfield.smartpantry'
    compileSdk 34

    defaultConfig {
        applicationId "za.co.richfield.smartpantry"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Used by the Settings screen "About" dialog.
        resValue "string", "app_version_name", versionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // The pantry/recipe matching rules are plain Java, so they are covered by local unit tests
    // that run on the development machine with ./gradlew test (no emulator needed).
    testImplementation 'junit:junit:4.13.2'
}
