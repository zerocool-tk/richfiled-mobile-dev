<rect x="440" y="748" width="580" height="36" rx="18" fill="#C8E6C9"/>
<text x="730" y="771" text-anchor="middle" font-family="Helvetica, Verdana, DejaVu Sans, sans-serif" font-size="13" fill="#1B5E20">The navigation drawer switches between screens 1, 3, 5, 6 and 7</text>
<text x="730.0" y="818" text-anchor="middle" font-family="Helvetica, Verdana, DejaVu Sans, sans-serif" font-size="12.5" fill="#616161">Every list screen reloads from SQLite in onResume(), so a change made on one screen is immediately visible on the others.</text>
</svg>