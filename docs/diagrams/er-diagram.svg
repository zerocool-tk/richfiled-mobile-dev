<text x="76" y="307" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="normal" fill="#212121">unit</text>
<text x="644" y="307" text-anchor="end" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11.5" fill="#616161">TEXT NOT NULL   g | kg | ml | l | tsp | tbsp | count</text>
