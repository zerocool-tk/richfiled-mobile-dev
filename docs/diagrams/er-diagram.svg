<rect width="1420" height="880" fill="#FFFFFF"/>
<text x="710.0" y="44" text-anchor="middle" font-family="Helvetica, Verdana, DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#1B5E20">Smart Pantry Manager - Database Design (ER Diagram)</text>
<text x="710.0" y="72" text-anchor="middle" font-family="Helvetica, Verdana, DejaVu Sans, sans-serif" font-size="13.5" fill="#616161">SQLite database smart_pantry.db, created and versioned by DatabaseHelper (SQLiteOpenHelper, version 1)</text>
